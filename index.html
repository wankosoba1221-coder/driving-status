<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>運転状況</title>

<!-- 可愛いフォント（M PLUS Rounded 1c）の読み込み -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #1a1a24;
  color: white;
  font-family: 'M PLUS Rounded 1c', sans-serif;
  text-align: center;
}

.container {
  max-width: 400px;
  margin: auto;
  padding: 40px 20px;
}

h2 {
  font-size: 20px;
  color: #bbb;
  letter-spacing: 2px;
}

#status {
  font-size: 44px;
  font-weight: 800;
  margin: 40px 0 15px;
  text-shadow: 0 4px 12px rgba(0,0,0,0.3);
}

#time {
  color: #888;
  font-size: 14px;
  margin-bottom: 30px;
}
</style>
</head>

<body>

<div class="container">

<h2>現在の状態</h2>

<div id="status">読み込み中...</div>

<div id="time"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://pgxnkytfkhpyxyvltwlr.supabase.co";
const SUPABASE_KEY = "sb_publishable_Pcv1LgyrlbZ5036zwmM3KQ_6aIUtnac";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function loadStatus() {
  const { data, error } = await db
    .from("status")
    .select("*")
    .eq("id", 1)
    .single();

  if (error) {
    document.getElementById("status").textContent = "エラー";
    return null;
  }

  if (data.driving) {
    document.getElementById("status").textContent = "運転中";
  } else {
    document.getElementById("status").textContent = "ひま";
  }

  document.getElementById("time").textContent =
    "最終更新: " + new Date(data.updated_at).toLocaleString("ja-JP");
  
  return data;
}


async function setDriving(value) {
  const { error } = await db
    .from("status")
    .update({
      driving: value,
      updated_at: new Date().toISOString()
    })
    .eq("id", 1);

  if (error) {
    alert("変更に失敗しました");
    return;
  }
  loadStatus();
}


// --- URLに ?toggle=1 または ?toggle/1 がある時にトグル切替 ---
async function initToggle() {
  const urlParams = new URLSearchParams(window.location.search);
  const hasToggle = urlParams.has('toggle') || window.location.search.includes('toggle');

  if (hasToggle) {
    const { data, error } = await db.from("status").select("driving").eq("id", 1).single();
    
    if (!error && data) {
      await setDriving(!data.driving);
      // URLから ?toggle を消してリロードでの連続発動を防止
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  }
}

loadStatus();
initToggle();
setInterval(loadStatus, 3000);

</script>

</body>
</html>
